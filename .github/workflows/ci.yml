name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python and JSON syntax
        run: |
          python - <<'PY'
          import ast
          import json
          import subprocess
          from pathlib import Path

          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for filename in filter(None, files):
              path = Path(filename)
              if path.suffix == '.py':
                  ast.parse(path.read_text(encoding='utf-8-sig'), filename=filename)
              elif path.suffix == '.json':
                  json.loads(path.read_text(encoding='utf-8-sig'))
          PY

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Check backend imports
        run: python -c "import main"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check JavaScript syntax
        run: |
          git ls-files -z -- '*.js' '*.mjs' '*.cjs' | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=optional --no-fund --no-audit

      - name: Build frontend
        working-directory: frontend
        run: npm run build
