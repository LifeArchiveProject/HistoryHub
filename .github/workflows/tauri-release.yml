name: Frontend desktop build

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-tauri:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-universal
            platform: macos-latest
            args: --target universal-apple-darwin --config src-tauri/tauri.macos.conf.json
          - label: linux-x64
            platform: ubuntu-24.04
            args: --config src-tauri/tauri.linux.conf.json
          - label: windows-x64
            platform: windows-latest
            args: --config src-tauri/tauri.windows.conf.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "frontend/src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            fakeroot \
            libfuse2

      - name: Install Windows dependencies
        if: matrix.platform == 'windows-latest'
        run: choco install nsis -y

      - name: Install frontend dependencies
        run: npm ci --include=optional --no-fund --no-audit

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0.6
        with:
          projectPath: frontend
          tauriScript: npx tauri
          args: ${{ matrix.args }}

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HistoryHub-frontend-${{ matrix.label }}
          path: |
            frontend/src-tauri/target/**/release/bundle/nsis/*.exe
            frontend/src-tauri/target/**/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/**/release/bundle/deb/*.deb
            frontend/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
