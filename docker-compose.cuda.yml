services:
  backend:
    image: ghcr.io/lifearchiveproject/bilibili-history-fetcher:cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack: 67108864
